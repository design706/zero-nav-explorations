# Build and publish the prototype.
#
# The bundle is PATCHED, and two chats work on this repo at once. If each built
# and committed the bundle, whichever pushed last would silently revert the
# other's bundle-level work. So the bundle is never committed: it is built here
# from EVERY lane's rule file, which means a published build can only ever
# contain more than one lane alone — never less.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes close together serialise instead of racing. `cancel-in-progress`
# is false on purpose: every push should produce a build, and the later one
# already contains the earlier one's commits.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (all lanes)
        run: node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
